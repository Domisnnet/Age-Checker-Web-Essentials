<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verificador de Idade Moderno</title>
    <!-- Apontei para o novo arquivo que será gerado pelo SASS -->
    <link rel="stylesheet" href="src/css/main.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header class="bg-primary text-white text-center p-3">
      <h1>Verificação de Idade</h1>
    </header>

    <main class="container mt-5">
      <section id="principal" class="card p-4">
        <div class="mb-3">
          <label for="txtano" class="form-label">Ano de Nascimento:</label>
          <input type="number" class="form-control" name="txtano" id="txtano" min="0" />
          <div id="ano-feedback" class="invalid-feedback"></div>
        </div>
        <div class="mb-3">
          <p class="mb-1">Sexo:</p>
          <div class="form-check">
            <input type="radio" class="form-check-input" name="radsex" id="mas" checked />
            <label class="form-check-label" for="mas">Masculino</label>
          </div>
          <div class="form-check">
            <input type="radio" class="form-check-input" name="radsex" id="fem" />
            <label class="form-check-label" for="fem">Feminino</label>
          </div>
        </div>
        <p>
          <input
            type="button"
            class="btn btn-primary"
            value="Verificar"
            id="verificar-btn"
          />
        </p>
        <div id="res" class="mt-3">Preencha os dados acima para ver o Resultado!</div>
      </section>
    </main>

    <footer class="text-center p-3 mt-auto bg-dark text-light">
      <p class="fst-italic">© Aprendendo com Alura e Gemini</p>
    </footer>

    <!-- Importando o JavaScript do Bootstrap -->
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Carregando nosso app.js como um módulo -->
    <script src="js/app.js" type="module"></script>
  </body>
</html>
