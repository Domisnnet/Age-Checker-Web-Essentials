<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verificador de Idade Moderno</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="src/css/main.css" />
    <link rel="icon" href="src/images/DomisDev.png" type="image/png" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <main class="flex-grow-1 d-flex align-items-center justify-content-center">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" id="logo"> 
        <g class="ring"> 
          <circle cx="50" cy="50" r="46" fill="none" stroke="#00ff7f" stroke-width="4"/> 
        </g> 
        <text class="mark" x="50" y="58" text-anchor="middle" fill="#00ff7f" font-size="34" font-weight="700" letter-spacing="4">&lt;/&gt;</text> 
      </svg>
      <section id="principal" class="p-4">
        <h1 class="text-center mb-4">Verificação de Idade</h1>
        <div class="mb-3">
          <label for="txtano" class="form-label">Ano de Nascimento:</label>
          <input type="number" class="form-control" name="txtano" id="txtano" min="0" />
          <div id="ano-feedback" class="invalid-feedback"></div>
        </div>
        <div class="mb-3">
          <p class="mb-1">Sexo:</p>
          <div class="form-check">
            <input type="radio" class="form-check-input" name="radsex" id="mas" checked />
            <label class="form-check-label" for="mas">Masculino</label>
          </div>
          <div class="form-check">
            <input type="radio" class="form-check-input" name="radsex" id="fem" />
            <label class="form-check-label" for="fem">Feminino</label>
          </div>
        </div>
        <p>
          <input
            type="button"
            class="btn btn-success"
            value="Verificar"
            id="verificar-btn"
          />
        </p>
        <div id="res" class="mt-3 text-center" aria-live="polite">Preencha os dados acima para ver o Resultado!</div>
      </section>
    </main>
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js" type="module"></script>
  </body>
</html>
